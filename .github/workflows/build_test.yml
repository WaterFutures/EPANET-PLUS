name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libomp on macOS
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Export libomp paths on macOS
        if: runner.os == 'macOS'
        run: |
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_ENVIRONMENT_LINUX: >-
            CFLAGS=-fopenmp
            CXXFLAGS=-fopenmp
            LDFLAGS=-fopenmp
          CIBW_ENVIRONMENT_WINDOWS: >-
            CL=/openmp
          CIBW_ENVIRONMENT_MACOS: >-
            CC=clang
            CXX=clang++
            MACOSX_DEPLOYMENT_TARGET=15.0
            CPPFLAGS=-I${{ env.LIBOMP_PREFIX }}/include
            CFLAGS=-Xpreprocessor\ -fopenmp
            CXXFLAGS=-Xpreprocessor\ -fopenmp
            LDFLAGS=-L${{ env.LIBOMP_PREFIX }}/lib\ -Wl,-rpath,${{ env.LIBOMP_PREFIX }}/lib\ -lomp
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Test on all platforms except macOS
        if: runner.os != 'macOS'
        run: |
          python -m pip install -r REQUIREMENTS.txt
          python -m pip install -e .
          python -m pip install -r REQUIREMENTS-DEV.txt
          pytest -v

      - name: Test on macOS
        if: runner.os == 'macOS'
        env:
          CC: clang
          CXX: clang++
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          CPPFLAGS: -I${{ env.LIBOMP_PREFIX }}/include
          CFLAGS: -Xpreprocessor -fopenmp
          CXXFLAGS: -Xpreprocessor -fopenmp
          LDFLAGS: -L${{ env.LIBOMP_PREFIX }}/lib -Wl,-rpath,${{ env.LIBOMP_PREFIX }}/lib -lomp
        run: |
          python -m pip install -r REQUIREMENTS.txt
          python -m pip install -e .
          python -m pip install -r REQUIREMENTS-DEV.txt
          pytest -v

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl